# Builds the site on every pull request (so reviewers know it still works)
# and deploys to the cPanel host over FTPS on every push to main.
#
# Repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER     e.g. ftp.projecthomelab.org (hostname only)
#   FTP_USERNAME   a cPanel FTP account whose directory is public_html
#   FTP_PASSWORD
#
# Repository variable (same page → Variables tab), only if the FTP server uses
# a self-signed certificate, which is the cPanel default for FTP:
#   FTP_CERT_FINGERPRINT   the fingerprint shown in brackets in the
#                          "certificate is NOT trusted" error, e.g. CF:23:57:…
#   This trusts that one certificate and nothing else, so the connection is
#   still protected against impersonation. If the certificate is ever
#   replaced, the deploy fails with the new fingerprint; update the variable.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # lftp keeps one connection open, reuses the TLS session for data
      # transfers, limits itself to two parallel uploads and retries on
      # dropped connections, which shared-hosting FTP servers handle far
      # better than many short-lived connections.
      #
      # It only uploads; it never deletes anything on the server, so the
      # old wiki's images/ folder and any subdomain folders are untouched.
      - name: Deploy to cPanel over FTPS
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_CERT_FINGERPRINT: ${{ vars.FTP_CERT_FINGERPRINT }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Keep only hex digits and colons, so a paste that includes the
          # brackets, spaces or a line break still works.
          FP=$(printf '%s' "$FTP_CERT_FINGERPRINT" | tr -cd '0-9A-Fa-f:' | tr a-f A-F)
          PIN=""
          if [ -z "$FP" ]; then
            echo "No FTP_CERT_FINGERPRINT repository variable found; using normal certificate checks."
          elif ! printf '%s' "$FP" | grep -Eq '^([0-9A-F]{2}:){19,31}[0-9A-F]{2}$'; then
            echo "::error::FTP_CERT_FINGERPRINT doesn't look like a fingerprint after cleanup: '$FP'. Paste the colon-separated value from the certificate error."
            exit 1
          else
            echo "Trusting the FTP server certificate with fingerprint $FP"
            PIN="set ssl:verify-certificate/$FP no"
          fi
          lftp -c "
            set cmd:fail-exit yes
            set net:timeout 30
            set net:max-retries 5
            set net:reconnect-interval-base 5
            set ftp:passive-mode yes
            set ftp:ssl-force yes
            set ftp:ssl-protect-data yes
            set ftp:ssl-protect-list yes
            set ssl:verify-certificate yes
            $PIN
            open -u \"$FTP_USERNAME\" --env-password \"$FTP_SERVER\"
            mirror --reverse --no-perms --parallel=2 --verbose=1 dist/ ./
          "
